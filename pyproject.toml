[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setu"
version = "0.1.0"
description = "Offline multilingual document + voice agent for Snapdragon-powered HP PCs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Installed on the Snapdragon target. onnxruntime-qnn is Windows-ARM64 only.
snapdragon = [
    "onnxruntime-qnn>=1.19",
    "onnxruntime-genai>=0.4",
]
# Windows-only: exposes Windows.Media.Ocr, the offline OCR engine that ships with the OS.
# It is what makes document capture work with no model download at all.
windows = [
    "winsdk>=1.0.0b10",
]
# Portable fallback so reviewers can run everything on any laptop.
#
# The floor is 1.22, not 1.17: the INT8 Whisper encoder uses ConvInteger, and CPU
# providers before ~1.21 raise NOT_IMPLEMENTED for it at session-build time. The
# adapter then falls back to its stub and reports degraded, so speech recognition
# silently stops working with no error visible to the user. Do not lower this.
cpu = [
    "onnxruntime>=1.22",
]
audio = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]
# Tooling for regenerating the submission documents. Kept OUT of the runtime extras:
# markitdown pulls in magika, which pins onnxruntime<=1.20.1 on Windows and silently
# downgrades the runtime out from under the speech path.
docs = [
    "pymupdf>=1.24",
    "lxml>=5.0",
]

[project.scripts]
setu = "setu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "B",     # bugbear
    "C4",    # comprehensions
    "I",     # import order
    "PERF",  # obvious performance traps
    "PL",    # pylint subset
    "RUF",
    "SIM",
    "UP",    # pyupgrade
]
ignore = [
    # SETU's whole fallback design rests on broad excepts: every adapter must degrade to a
    # labelled stub rather than take the app down, and a failure to load one model must
    # never stop a consultation. These are deliberate and each one logs.
    "BLE001",
    # FastAPI's dependency idiom is a call in a default argument - File(...), Form(...).
    "B008",
    # Several subprocess calls intentionally inspect returncode themselves or tolerate
    # failure (probing for an optional system voice, reading a battery counter).
    "PLW1510",
    # Markdown tables are built from adjacent string literals on purpose; these are not
    # missing commas, and parenthesising every row hurts more than it helps.
    "ISC004",
    # Two-digit-year pivoting wants the LOCAL date, which is what date.today() gives.
    "DTZ011",
    # Probe loops that skip an unreadable sensor and carry on - the point is to not care.
    "S110", "S112",
    # Heavy and optional imports are deferred into functions on purpose: the package must
    # import fast, and onnxruntime, PIL, tokenizers and winsdk all have to stay optional so
    # the app runs on a machine that has none of them.
    "PLC0415",
    # Module-level singletons (the engine, the power sampler) are intentional: one
    # process holds one router and one learned cost model, which is the whole point.
    "PLW0603",
    # Devanagari punctuation and en-dashes are meant literally in prose and in the
    # sentence-splitting regex; they are not typos for ASCII.
    "RUF001",
    "PLR0911", "PLR0917",             # return/positional-arg counts
    "PLR0912", "PLR0913", "PLR0915",  # branch/arg/statement counts
    "PLR2004",                        # magic values: thresholds are named where it matters
    "PYI034",                         # __enter__ -> Self needs py3.11; the floor is 3.10
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose to pin down internal invariants.
"tests/*" = ["SLF001", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
